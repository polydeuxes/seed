[project]
name = "seed"
version = "0.1.0"
description = "Context-native tool-growing runtime prototype"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.scripts]
seed = "seed_runtime.process_entry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["seed_runtime*"]

[tool.pytest.ini_options]
markers = ["experimental_runtime_loop: quarantined RuntimeLoop coverage; not canonical runtime behavior"]
pythonpath = ["."]
testpaths = ["tests"]
