[project]
name = "seed"
version = "0.1.0"
description = "Exact occurrence-coordinate runtime"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.scripts]
seed = "seed_runtime.process_entry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["seed_runtime*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::SyntaxWarning",
]
