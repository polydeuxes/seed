[project]
name = "seed"
version = "0.1.0"
description = "Occurrence-bound Assertion runtime"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.scripts]
seed = "seed_runtime.process_entry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["seed_runtime*"]

[tool.pytest.ini_options]
markers = ["experimental_runtime_loop: quarantined RuntimeLoop coverage; not canonical runtime behavior"]
pythonpath = ["."]
testpaths = ["tests"]
# Probing a decoder with bytes it was not built for makes it complain while it
# answers. A warning is not a refusal, and filtering per probe costs 14x.
filterwarnings = [
    "ignore::DeprecationWarning:decoder_measurement",
    "ignore::SyntaxWarning",
]
