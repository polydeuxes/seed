name: Python compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install compiled Witness implementations
        run: sudo apt-get update && sudo apt-get install -y aspell aspell-en enchant-2
      - name: Install project and test dependencies
        run: python -m pip install -U pip pytest -e .
      - name: Compile runtime
        run: python -m compileall -q seed_runtime
      - name: Run tests
        run: pytest -q
